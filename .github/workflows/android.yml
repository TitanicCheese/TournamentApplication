name: Bygg Android-app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testa logik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: Bygg fristående webbversion
        run: node tools/build-single-html.js web Turnering.html
      - uses: actions/upload-artifact@v4
        with:
          name: Turnering-html
          path: Turnering.html

  build:
    name: Bygg APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bygg
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Turnering.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Turnering-apk
          path: Turnering.apk

      - uses: actions/download-artifact@v4
        with:
          name: Turnering-html

      - name: Publicera som "Senaste version"
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete senaste --yes --cleanup-tag || true
          gh release create senaste Turnering.apk Turnering.html \
            --target "$GITHUB_SHA" \
            --title "Senaste version (build ${{ github.run_number }})" \
            --notes "**Android:** ladda ner Turnering.apk på telefonen och öppna filen för att installera. **Webbläsare (dator/iPhone/surfplatta):** ladda ner Turnering.html och öppna den – fungerar även utan internet. Byggd från \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})."

      - name: Publicera versionsrelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Turnering.apk Turnering.html --title "Turnering $GITHUB_REF_NAME" --generate-notes
